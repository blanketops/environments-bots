# =============================================================================
# ci.yml — environments-bots CI
#
# Four jobs, following environments' ci.yml:
#   0. changes   — lists the files a push or pull request changed and reports
#                  whether any of them is not documentation. build, validate
#                  and code-docs skip when none is.
#   1. build     — fast compile check on every push, any branch.
#   2. validate  — gofmt, vet, golangci-lint, tests with coverage. Runs on
#                  pull requests and on pushes to main and develop.
#   3. code-docs — generates Go package docs with gomarkdoc and lands them on
#                  main through a pull request. Runs on push to main only.
#
# environments' vendor snapshot (vendor/ cached as an OCI image in GHCR) is
# left out: this module is small, and the runners keep Go's module and build
# caches on a persistent volume.
#
# Docs-only changes:
#   Skipping is done per job, through the `changes` job's output, and not with
#   `paths-ignore` on the trigger. A workflow filtered out by path never
#   reports its checks, so required ones would stay "Expected" and block the
#   pull request. A job skipped by `if:` reports as skipped, which satisfies a
#   required check. The gates fail open: they test `!= 'false'` under
#   `!cancelled()`, so if `changes` fails or yields no output the jobs run.
#
# Go version:
#   Read from go.mod by setup-go — never hardcoded in this file.
#
# Auth:
#   Only code-docs needs the GitHub App token (secrets.APP_ID /
#   APP_PRIVATE_KEY): main's `protect` ruleset takes changes only through a
#   pull request with verified commits and the App is not a bypass actor, so
#   hack/api-pr.sh opens one with a commit GitHub signs and squash-merges it.
#   Every other job needs no secret, so they also run on Dependabot PRs.
# =============================================================================

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 0: Changes
  # Outputs code=false only when every changed file is documentation; any
  # doubt (new branch, unreadable range, empty diff) leaves it true.
  # Workflow files are deliberately not documentation: a change under
  # .github/workflows/ must still run the pipeline.
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: self-hosted
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          DOCS='^(.*\.md|\.claude/.*|docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*)$'
          ZERO=0000000000000000000000000000000000000000

          code=true
          reason=""
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The checkout is the merge commit; its first parent is the base.
            range="HEAD^1 HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            reason="new branch, nothing to compare against"
          else
            range="$BEFORE $SHA"
          fi

          if [ -n "$range" ]; then
            # shellcheck disable=SC2086 # range is two revisions
            if files=$(git diff --name-only $range 2>/dev/null) && [ -n "$files" ]; then
              other=$(printf '%s\n' "$files" | grep -vE "$DOCS" || true)
              total=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
              if [ -z "$other" ]; then
                code=false
                reason="all $total changed files are documentation"
              else
                reason="$(printf '%s\n' "$other" | wc -l | tr -d ' ') of $total changed files are not documentation"
              fi
            else
              reason="could not list changed files"
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "code=$code ($reason)"

      - name: Summary
        if: always()
        run: |
          RESULT="${{ steps.detect.outputs.code == 'false' && 'Documentation only — build, validate and code-docs are skipped' || 'Code changed — full pipeline runs' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Change Detection

          **Result:** ${RESULT}
          **Reason:** ${{ steps.detect.outputs.reason || 'detection did not complete' }}
          **Event:** \`${{ github.event_name }}\`
          **Commit:** \`${{ github.sha }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build
  # Scope: push, every branch. A quick signal for feature-branch pushes.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: self-hosted
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The self-hosted runners keep Go's module and build caches on a
          # persistent volume. setup-go's own cache would upload them again
          # after every job, which on these runners hangs "Post Setup Go".
          cache: false

      - name: Build
        run: go build ./...

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Build passed' || '❌ Build failed' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔨 Fast Build Check

          **Status:** ${STATUS}
          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Validate
  # Scope: any pull request, or a push to main or develop.
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Lint, Vet, Test
    runs-on: self-hosted
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "The following files are not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi
          echo "All files formatted correctly"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint is baked into the self-hosted runner image, and its
          # analysis cache lives on the runners' persistent volume
          # (GOLANGCI_LINT_CACHE). The version is therefore whatever the
          # runner image pins.
          install-mode: none
          skip-cache: true
          args: --timeout=5m

      # No -race: the race detector needs cgo, and the runner image has no C
      # compiler.
      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | awk '/^total/ {print $3}')
          ROWS=$(go tool cover -func=coverage.out 2>/dev/null | grep -v '^total' \
            | awk '{printf "| `%s` | %s |\n", $2, $3}')
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # ✅ Lint, Vet, Test

          **Status:** ${{ job.status }}
          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Total coverage:** \`${TOTAL:-N/A}\`

          | Step | Tool |
          | --- | --- |
          | Formatting | \`gofmt -l\` |
          | Vet | \`go vet\` |
          | Lint | \`golangci-lint\` (runner image) |
          | Test | \`go test\` |

          <details>
          <summary>Coverage per function</summary>

          | Function | Coverage |
          | --- | --- |
          ${ROWS}

          </details>
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Code Docs
  # Scope: push to main only.
  # ───────────────────────────────────────────────────────────────────────────
  code-docs:
    name: Generate Code Docs
    runs-on: self-hosted
    # One docs run at a time, so two pushes do not race to open the same
    # pull request.
    concurrency:
      group: code-docs
      cancel-in-progress: false
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-bots

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate docs
        run: |
          mkdir -p docs/code
          gomarkdoc --output 'docs/code/{{.Dir}}.md' ./...

      # Through a pull request: main's `protect` ruleset takes changes only
      # through a pull request with verified commits, and the App is not a
      # bypass actor. hack/api-pr.sh opens one with a commit GitHub signs and
      # squash-merges it; the skip marker in the message keeps that from
      # starting workflows, including this one.
      - name: Commit docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          hack/api-pr.sh main "docs/code-${GITHUB_SHA::7}" \
            "docs: auto-generate code documentation [skip ci]" docs/code/

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: godoc-${{ github.sha }}
          path: docs/code/
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## 📚 Code Documentation"
            echo ""
            echo "Generated from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`."
            echo ""
            find docs/code -name "*.md" | sort | while read -r f; do
              echo "- \`${f#docs/code/}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
