# =============================================================================
# pr-review.yml — Review pull requests with the PR Reviewer bot
#
# Runs on every pull request open, reopen, and synchronize. The reviewer
# (cmd/pr-reviewer), as the BlanketOps Environments PR Reviewer App, reads the
# pull request diff, the repository's PULL_REQUEST_TEMPLATE.md and issue
# templates, checks the PR body against the template checklist, flags common
# issues (hardcoded secrets, large files, missing tests), and posts a review
# comment with labels.
#
# Secrets required:
#   PR_REVIEWER_APP_ID, PR_REVIEWER_APP_PRIVATE_KEY — the PR Reviewer App
# =============================================================================

name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: PR Review
    runs-on: self-hosted

    steps:
      - name: Generate PR Reviewer App token
        id: pr-reviewer-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PR_REVIEWER_APP_ID }}
          private-key: ${{ secrets.PR_REVIEWER_APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: ${{ github.event.repository.name }}

      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build pr-reviewer
        run: go build -o "${RUNNER_TEMP}/pr-reviewer" ./cmd/pr-reviewer

      - name: Review pull request
        env:
          GH_TOKEN: ${{ steps.pr-reviewer-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          "${RUNNER_TEMP}/pr-reviewer" review -pr "${PR}"
