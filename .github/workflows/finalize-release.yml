# =============================================================================
# finalize-release.yml — Merge, Tag, and Sync a Release
#
# Manually triggered. Merges release/{version} into main, regenerates the
# code docs and the changelog there, tags the result, syncs main back into
# develop, then deletes the release branch. Creating the tag triggers the
# Release workflow (signed binaries and the GitHub Release).
#
# Auth:
#   Uses the BlanketOps-Environments GitHub App instead of a personal-account
#   PAT — see ci.yml's header for the reasoning.
#
# Verified commits:
#   main requires verified signatures. A commit made with `git commit` in a
#   workflow is never verified, whatever key signs it: the CI key commits as
#   an address no account can verify. So nothing here is committed or pushed
#   with git. Merges go through the merges API (hack/api-merge.sh) and file
#   changes through createCommitOnBranch (hack/api-commit.sh); GitHub makes
#   and signs those commits itself. The tag is created through the API too.
#
# Docs regeneration:
#   ci.yml's code-docs job also regenerates docs/code on every push to main,
#   but it runs as a separate, asynchronously-triggered workflow run. This
#   job used to merge main back into develop immediately after tagging,
#   which raced ahead of that async commit — develop never actually
#   received it, and drifted a little further from main's generated docs on
#   every release. The generate-and-commit steps below make this job
#   self-sufficient: docs are regenerated and committed to main
#   synchronously, before merging back into develop, so develop is always
#   caught up regardless of what ci.yml's code-docs job does on its own
#   schedule.
#
# Changelog generation:
#   release.yml (triggered separately by the tag push below) used to
#   generate CHANGELOG.md and commit it to main itself — the same async
#   race as the docs one above, just for a different file. Generating and
#   committing it here instead, before merging back into develop, means
#   develop is caught up on the changelog too, and release.yml no longer
#   needs to touch main at all — it just reads the already-current
#   CHANGELOG.md for its release notes.
#
# Tag placement:
#   The tag is created last on main, on the changelog commit. It used to be
#   created on the code-docs commit, whose message carries [skip ci]; GitHub
#   then skipped every workflow the tag should have started, and no GitHub
#   Release was produced. The changelog is rendered for the
#   version with `git-cliff --tag` before the tag exists.
#
# Secrets required:
#   APP_ID, APP_PRIVATE_KEY — GitHub App credentials
#   RELEASER_APP_ID, RELEASER_APP_PRIVATE_KEY — the BlanketOps Environments
#   Releaser App, which runs cmd/releaser on the Release issue
# =============================================================================

name: Finalize Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to finalize (e.g. v0.0.9)"
        required: true
permissions:
  contents: read
jobs:
  finalize:
    runs-on: self-hosted
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-bots

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The scripts come from the release branch, which is what is being
      # released, or from main for one cut before they existed. They are
      # copied out of the checkout because the steps below move it.
      #
      # main's `protect` ruleset takes changes only through a pull request
      # and the App is not a bypass actor: the release branch is merged
      # through its pull request (api-merge-pr.sh) and every file change
      # lands through a pull request of its own (api-pr.sh).
      - name: Stage the API helpers
        run: |
          for script in api-commit.sh api-merge.sh api-merge-pr.sh api-pr.sh; do
            git show "origin/release/${VERSION}:hack/${script}" > "${RUNNER_TEMP}/${script}" 2>/dev/null \
              || git show "origin/main:hack/${script}" > "${RUNNER_TEMP}/${script}"
            chmod +x "${RUNNER_TEMP}/${script}"
          done

      # The releaser (cmd/releaser), as the Releaser App, checks before
      # anything is merged: one open Release issue, nothing still open into
      # release/<version> or in the version's milestone, no tag yet. It is
      # built from the release branch being finalized.
      - name: Generate Releaser App token
        id: releaser-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-bots

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build releaser
        run: |
          git checkout --quiet --detach "origin/release/${VERSION}"
          go build -o "${RUNNER_TEMP}/releaser" ./cmd/releaser
          git checkout --quiet -

      - name: Releaser verify
        env:
          GH_TOKEN: ${{ steps.releaser-token.outputs.token }}
        run: '"${RUNNER_TEMP}/releaser" verify -release "${VERSION}"'

      # A release pull request merged by hand leaves nothing to merge: the
      # release branch is then not ahead of main, and opening a pull request
      # for an empty difference fails (HTTP 422). The steps after this one
      # still run on main as merged.
      - name: Merge release into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ahead=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/main...release/${VERSION}" \
            | jq -r '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "::notice::release/${VERSION} is already in main (its pull request was merged); nothing to merge"
            git fetch --quiet origin main
            git checkout --quiet --detach origin/main
            exit 0
          fi
          "${RUNNER_TEMP}/api-merge-pr.sh" main "release/${VERSION}" \
            "release: merge release/${VERSION} into main"

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate code docs
        run: |
          mkdir -p docs/code
          gomarkdoc --output 'docs/code/{{.Dir}}.md' ./...

      - name: Commit code docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-pr.sh" main "release/${VERSION}-docs" \
            "docs: auto-generate code documentation [skip ci]" docs/code
          git fetch --quiet origin main
          git checkout --quiet --detach origin/main

      # git-cliff is baked into the runner image (zenith-runner-toolchain).
      - name: git-cliff version
        run: git-cliff --version

      # --tag renders the commits since the last release under this version:
      # the tag itself is only created after this file is committed.
      - name: Generate CHANGELOG.md
        run: git-cliff --config .cliff.toml --tag "${VERSION}" --output CHANGELOG.md

      - name: Commit changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-pr.sh" main "release/${VERSION}-changelog" \
            "chore(release): update changelog for ${VERSION}" CHANGELOG.md
          git fetch --quiet origin main
          git checkout --quiet --detach origin/main

      # On the changelog commit, not the [skip ci] docs commit before it. See
      # the header: a tag on a [skip ci] commit starts no workflow.
      - name: Tag release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sha=$(git rev-parse HEAD)
          jq -n --arg ref "refs/tags/${VERSION}" --arg sha "$sha" '{ref: $ref, sha: $sha}' \
            | curl -sS --fail-with-body -X POST \
                -H "Authorization: bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                --data-binary @- \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs" >/dev/null
          echo "Tagged ${sha} as ${VERSION}"
          echo "tag_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Merge main back into develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-merge.sh" develop main \
            "chore: sync develop with main after release/${VERSION}"

      # A branch rule may forbid deleting release branches. The release is
      # complete either way, so a refusal is reported, not failed on.
      - name: Delete release branch
        id: delete-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/release/${VERSION}")
          if [ "$status" = 204 ]; then
            echo "deleted=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release/${VERSION} was not deleted (HTTP ${status}); a branch rule may protect it"
            echo "deleted=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🎉 Release Finalized

          **Version:** \`${{ github.event.inputs.version }}\`

          ## Completed

          - Merged \`release/${{ github.event.inputs.version }}\` into \`main\`
          - Regenerated the code docs and the changelog on \`main\`
          - Created Git tag \`${{ github.event.inputs.version }}\` on the changelog commit
          - Synced \`main\` back into \`develop\`
          - Release branch deleted: ${{ steps.delete-branch.outputs.deleted }}

          ## Branch Flow

          release/${{ github.event.inputs.version }} → main → develop

          ## Next Steps

          - Creating the tag triggers the **Release** workflow, which builds and signs the binaries and publishes the GitHub Release.
          EOF
